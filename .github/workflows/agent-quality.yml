name: Agent Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/attack/agentScanProtocol.ts'
      - 'src/attack/agentScanExecutor.ts'
      - 'src/attack/agentScanLoop.ts'
      - 'src/attack/verifyLoop.ts'
      - 'src/tools/agentScan.ts'
      - 'src/project-map/capabilityRegistry.ts'
      - 'src/project-map/callGraphExtractor.ts'
      - 'src/project-map/scanCache.ts'
      - 'src/project-map/taintTracker.ts'
      - 'src/project-map/sinkRegistry.ts'
      - 'src/project-map/guardEvaluator.ts'
      - 'src/utils/gitContext.ts'
      - 'src/utils/securityConfig.ts'
      - 'src/utils/localTestRunner.ts'
      - 'src/utils/verificationSandbox.ts'
      - 'src/utils/testSafety.ts'
      - 'tooling/agent-testset/**'
      - 'tooling/runAgentEval.ts'
      - 'tooling/checkAgentRegression.ts'
      - 'src/tooling/agentEvalScoring.ts'
      - 'src/tooling/agentRegression.ts'
      - '.github/workflows/agent-quality.yml'

jobs:
  detect-changes:
    name: Detect Agent Scan Changes
    runs-on: ubuntu-latest
    outputs:
      agent-changed: ${{ steps.check.outputs.agent-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE '^(src/attack/|src/tools/agentScan|src/project-map/|src/utils/(gitContext|securityConfig|localTestRunner|verificationSandbox|testSafety)|tooling/)'; then
            echo "agent-changed=true" >> $GITHUB_OUTPUT
          else
            echo "agent-changed=false" >> $GITHUB_OUTPUT
          fi

  unit-tests:
    name: Agent Unit Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.agent-changed == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/agentScanLoop.test.ts tests/agentScanExecutor.test.ts tests/agentScan.confidence.test.ts tests/callGraphExtractor.test.ts tests/agentEvalScoring.test.ts tests/agentRegression.test.ts tests/gitContext.test.ts tests/securityConfig.test.ts

  regression-gate:
    name: Regression Gate (requires eval artifact)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: needs.detect-changes.outputs.agent-changed == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          echo "## Agent Quality Gate"
          echo ""
          echo "Regression gate requires a fresh eval artifact."
          echo ""
          echo "To run the gate:"
          echo "1. Run: npx tsx tooling/runAgentEval.ts --api-url \$API_URL --api-token \$API_TOKEN --output eval-result.json"
          echo "2. Run: npx tsx tooling/checkAgentRegression.ts --result eval-result.json"
          echo ""
          echo "The gate fails when:"
          echo "- Precision drops > 0.02"
          echo "- Recall drops > 0.02"
          echo "- Completion rate drops > 0.03"
          echo "- Cache version or commit SHA mismatch"
          echo ""
          echo "This job is a placeholder — the live eval runs manually with API credentials."
          echo "Attach the eval artifact to the PR for review."
